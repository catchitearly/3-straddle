name: Straddle VWAP Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backtest start date (YYYY-MM-DD)"
        required: false
        default: ""
      end_date:
        description: "Backtest end date (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

# Pages here is deployed from the /docs folder on this branch (Settings ->
# Pages -> Source = "Deploy from a branch", branch = main /docs). That means
# there is NO separate deploy step in this workflow - GitHub picks up the
# new commit to docs/ and republishes automatically, usually within a minute.
# This concurrency group is just to stop two runs (or a run overlapping with
# live_notifier.yml) from racing on the git push.
concurrency:
  group: "docs-pages"
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        run: |
          python run_backtest.py "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}"

      - name: Rebuild combined pages site (backtest + live status)
        run: python render_pages.py

      - name: Commit docs/ + cache back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache docs/
          git diff --staged --quiet || git commit -m "Update backtest results + pages [skip ci]"
          git pull --rebase origin HEAD
          git push
