name: Live Straddle Notifier

# Triggered by cron-job.org calling GitHub's repository_dispatch API every
# ~2 minutes during market hours (see README for the exact cron-job.org
# request setup). workflow_dispatch is here too so you can trigger a manual
# test run from the Actions tab.
on:
  repository_dispatch:
    types: [live_check]
  workflow_dispatch: {}

permissions:
  contents: write

# Pages here is deployed from the /docs folder on this branch (Settings ->
# Pages -> Source = "Deploy from a branch", branch = main /docs) - so there
# is NO separate deploy-pages step in this workflow. Committing the updated
# docs/ folder is enough; GitHub republishes automatically, usually within
# a minute. Shared "docs-pages" group with backtest.yml so every run that
# touches docs/ or data/*.json queues through one lane instead of racing.
concurrency:
  group: "docs-pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live notifier
        run: python live_notifier.py

      - name: Rebuild combined pages site (backtest + live status)
        run: python render_pages.py

      - name: Commit state + docs/ back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_state.json docs/
          git diff --staged --quiet || git commit -m "Update live state + pages [skip ci]"
          # pull --rebase guards against a slow-finishing previous run having
          # already pushed while this one was mid-flight
          git pull --rebase origin HEAD
          git push
