name: Live Straddle Notifier

# Triggered by cron-job.org calling GitHub's repository_dispatch API every
# ~2 minutes during market hours (see README for the exact cron-job.org
# request setup). workflow_dispatch is here too so you can trigger a manual
# test run from the Actions tab.
on:
  repository_dispatch:
    types: [live_check]
  workflow_dispatch: {}

permissions:
  contents: write

# Runs must NOT overlap - two runs racing on the same state file would double
# up entries and fight over the git push. Queue instead of running parallel.
concurrency:
  group: live-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live notifier
        run: python live_notifier.py

      - name: Commit state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_state.json
          git diff --staged --quiet || git commit -m "Update live state [skip ci]"
          # pull --rebase guards against a slow-finishing previous run having
          # already pushed while this one was mid-flight
          git pull --rebase origin HEAD
          git push
